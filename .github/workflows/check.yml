name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No file may contain the failure marker
        run: |
          if grep -rIl --exclude-dir=.git --exclude-dir=.github 'FAIL' .; then
            echo "a file contains the failure marker"
            exit 1
          fi
